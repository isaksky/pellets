name: Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation-tests:
    name: Foundation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify native Windows AMD64 runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((go env GOHOSTOS) -ne "windows" -or (go env GOHOSTARCH) -ne "amd64") {
            throw "foundation tests require a native Windows AMD64 runner"
          }
          $git = Get-Command git -CommandType Application -ErrorAction Stop
          if ([IO.Path]::GetExtension($git.Source) -ne ".exe") {
            throw "foundation tests require native Git for Windows, found $($git.Source)"
          }
      - name: Run complete unit and compiled integration suite on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -json ./... | tee test-results.jsonl
      - name: Run complete unit and compiled integration suite under PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -count=1 -json ./... | Tee-Object -FilePath test-results.jsonl
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            exit $testExit
          }
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: foundation-test-results-${{ runner.os }}-${{ runner.arch }}
          path: test-results.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Run static analysis
        run: go vet ./...

  cgo-free-cross-builds:
    name: CGo-free cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and verify target metadata
        run: bash scripts/verify-cross-builds.sh

  release-archives:
    name: Build and verify release archives on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache-dependency-path: go.sum
      - name: Select release version
        id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              printf 'release tag must be v followed by a stable SemVer core: %s\n' "$GITHUB_REF_NAME" >&2
              exit 1
            fi
          else
            version="0.0.0"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build, verify, and smoke-test release archives
        run: |
          ./scripts/build-release.sh "${{ steps.release-version.outputs.version }}"
          printf '%s\n' "${{ steps.release-version.outputs.version }}" >dist/release-version.txt
      - name: Retain verified release archives
        uses: actions/upload-artifact@v7
        with:
          name: pellets-release-archives
          path: dist/
          if-no-files-found: error
          retention-days: 14

  windows-release-smoke:
    name: Smoke-test macOS-produced Windows archive
    needs: release-archives
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download verified release archives
        uses: actions/download-artifact@v7
        with:
          name: pellets-release-archives
          path: dist
      - name: Unpack and run the Windows AMD64 archive natively
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne "X64") {
            throw "release smoke test requires a native Windows AMD64 runner"
          }

          $version = (Get-Content "dist/release-version.txt").Trim()
          $archiveName = "pellets_${version}_windows_amd64.zip"
          $archive = Join-Path $PWD "dist/$archiveName"
          $manifest = Join-Path $PWD "dist/pellets_${version}_checksums.txt"
          $manifestLine = @(Get-Content $manifest | Where-Object { $_ -like "*  $archiveName" })
          if ($manifestLine.Count -ne 1) {
            throw "checksum manifest does not contain exactly one $archiveName entry"
          }
          $expectedHash = ($manifestLine -split "  ")[0]
          $actualHash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Windows archive checksum mismatch"
          }

          $unpacked = Join-Path $env:RUNNER_TEMP "pellets-release-smoke"
          Expand-Archive -LiteralPath $archive -DestinationPath $unpacked
          $entries = @(Get-ChildItem -LiteralPath $unpacked | Sort-Object Name | ForEach-Object Name)
          $expectedEntries = @("LICENSE", "pl.exe", "THIRD_PARTY_NOTICES.txt") | Sort-Object
          if (Compare-Object $expectedEntries $entries) {
            throw "unexpected Windows archive entries: $($entries -join ', ')"
          }

          $executable = Join-Path $unpacked "pl.exe"
          $versionOutput = & $executable --version
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "pl $version (JSON schema 1)") {
            throw "unexpected pl --version result: $versionOutput"
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP "pellets-workflow-smoke"
          New-Item -ItemType Directory -Path $smokeRoot | Out-Null
          git -C $smokeRoot init -q
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          $env:NO_COLOR = "1"
          $env:HTTP_PROXY = "http://127.0.0.1:1"
          $env:HTTPS_PROXY = "http://127.0.0.1:1"
          $env:ALL_PROXY = "http://127.0.0.1:1"
          $env:NO_PROXY = ""
          Push-Location $smokeRoot
          try {
            $initialized = & $executable init --code smoke | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $initialized.command -ne "init" -or $initialized.data.code -ne "smoke") {
              throw "pl init smoke failed"
            }
            $added = & $executable add "release archive smoke" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $added.data.id -ne "smoke-1") { throw "pl add smoke failed" }
            $started = & $executable start-next | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $started.data.pellet.status -ne "in_progress") { throw "pl start-next smoke failed" }
            $closed = & $executable close smoke-1 | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $closed.data.status -ne "closed") { throw "pl close smoke failed" }
          } finally {
            Pop-Location
          }

  homebrew-release-check:
    name: Validate and install the Homebrew formula
    needs: release-archives
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Download verified release archives
        uses: actions/download-artifact@v7
        with:
          name: pellets-release-archives
          path: dist
      - name: Validate committed formula style
        run: brew style Formula/pl.rb
      - name: Match release metadata or prepare the CI test formula
        shell: bash
        run: |
          version="$(<dist/release-version.txt)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            ./scripts/update-homebrew-formula.sh --check "$version" dist
          else
            ./scripts/update-homebrew-formula.sh --write "$version" dist
          fi
      - name: Install and test the native formula without artifact network access
        shell: bash
        run: ./scripts/test-homebrew-formula.sh "$(<dist/release-version.txt)" dist

  release-platform-gate:
    name: Release gate (supported platforms)
    if: always()
    needs:
      - foundation-tests
      - cgo-free-cross-builds
      - release-archives
      - windows-release-smoke
      - homebrew-release-check
    runs-on: ubuntu-latest
    steps:
      - name: Require native tests, cross-builds, and archive smoke tests
        env:
          NATIVE_TEST_RESULT: ${{ needs.foundation-tests.result }}
          CROSS_BUILD_RESULT: ${{ needs.cgo-free-cross-builds.result }}
          ARCHIVE_RESULT: ${{ needs.release-archives.result }}
          WINDOWS_SMOKE_RESULT: ${{ needs.windows-release-smoke.result }}
          HOMEBREW_RESULT: ${{ needs.homebrew-release-check.result }}
        run: |
          test "$NATIVE_TEST_RESULT" = success
          test "$CROSS_BUILD_RESULT" = success
          test "$ARCHIVE_RESULT" = success
          test "$WINDOWS_SMOKE_RESULT" = success
          test "$HOMEBREW_RESULT" = success

  publish-release:
    name: Publish tagged GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-platform-gate
      - release-archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives that passed every gate
        uses: actions/download-artifact@v7
        with:
          name: pellets-release-archives
          path: dist
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(<dist/release-version.txt)"
          gh release create "$GITHUB_REF_NAME" \
            "dist/pellets_${version}_darwin_amd64.tar.gz" \
            "dist/pellets_${version}_darwin_arm64.tar.gz" \
            "dist/pellets_${version}_windows_amd64.zip" \
            "dist/pellets_${version}_checksums.txt" \
            --verify-tag \
            --generate-notes \
            --title "Pellets $version"
